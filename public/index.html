<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دستیار صوتی Gemini روی موبایل</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }
    .card {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }
    .btn-record {
      width: 100%;
      border-radius: 50px;
      padding: 18px;
      margin-top: 15px;
      font-size: 17px;
      font-weight: bold;
      background: #03dac6;
      color: #000;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-record.recording {
      background: #cf6679;
      color: #fff;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2d2d2d;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
    .btn-send {
      background: #bb86fc;
      color: #000;
      border: none;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .status { margin-top: 15px; color: #03dac6; font-size: 14px; min-height: 24px; }
    .box {
      background: #2d2d2d;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      text-align: right;
      min-height: 40px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>🎙️ دستیار صوتی Gemini</h2>
  
  <button id="recordBtn" class="btn-record" onclick="toggleRecording()">شروع ضبط صدا 🎤</button>
  
  <div class="input-group">
    <input type="text" id="textInput" placeholder="یا تایپ کنید..." onkeypress="if(event.key==='Enter') sendTextMessage()">
    <button class="btn-send" onclick="sendTextMessage()">ارسال 🚀</button>
  </div>

  <div id="status" class="status">آماده برای گفتگو...</div>

  <div class="box" id="aiText">هوش مصنوعی: -</div>
</div>

<script>
  let mediaRecorder;
  let audioChunks = [];
  let isRecording = false;

  async function toggleRecording() {
    const btn = document.getElementById('recordBtn');
    const status = document.getElementById('status');

    if (!isRecording) {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
          await sendAudioToGemini(audioBlob);
        };

        mediaRecorder.start();
        isRecording = true;
        btn.innerText = 'توقف و ارسال صدا ⏹️';
        btn.classList.add('recording');
        status.innerText = 'در حال ضبط صدای شما... صحبت کنید';
      } catch (err) {
        alert('اجازه دسترسی به میکروفون داده نشد!');
        console.error(err);
      }
    } else {
      mediaRecorder.stop();
      isRecording = false;
      btn.innerText = 'شروع ضبط صدا 🎤';
      btn.classList.remove('recording');
      status.innerText = 'در حال ارسال فایل صوتی به Gemini...';
    }
  }

  async function sendAudioToGemini(blob) {
    const reader = new FileReader();
    reader.readAsDataURL(blob);
    reader.onloadend = async () => {
      const base64Data = reader.result.split(',')[1];
      const mimeType = blob.type.split(';')[0] || 'audio/webm';

      try {
        const response = await fetch('/api/chat-audio', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ audioBase64: base64Data, mimeType: mimeType })
        });

        const data = await response.json();
        const reply = data.reply || data.error || 'خطا در پاسخ';
        
        document.getElementById('aiText').innerText = 'هوش مصنوعی: ' + reply;
        document.getElementById('status').innerText = 'در حال خواندن پاسخ...';
        speak(reply);
      } catch (err) {
        document.getElementById('status').innerText = 'خطا در ارتباط با سرور';
      }
    };
  }

  async function sendTextMessage() {
    const input = document.getElementById('textInput');
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    document.getElementById('status').innerText = 'در حال پردازش...';

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      const reply = data.reply || data.error || 'خطا در پاسخ';

      document.getElementById('aiText').innerText = 'هوش مصنوعی: ' + reply;
      document.getElementById('status').innerText = 'در حال خواندن پاسخ...';
      speak(reply);
    } catch (err) {
      document.getElementById('status').innerText = 'خطا در ارتباط با سرور';
    }
  }

  function speak(text) {
    // استفاده از موتور صوتی آنلاین برای پخش روان صدای فارسی
    const cleanText = encodeURIComponent(text.substring(0, 200));
    const ttsUrl = `[suspicious link removed]{cleanText}&tl=fa&client=tw-ob`;
    
    const audio = new Audio(ttsUrl);
    audio.play().then(() => {
      document.getElementById('status').innerText = 'آماده برای گفتگو...';
    }).catch(() => {
      // پشتیبانی جایگزین در صورت نیاز
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'fa-IR';
        window.speechSynthesis.speak(utterance);
      }
      document.getElementById('status').innerText = 'آماده برای گفتگو...';
    });
  }
</script>

</body>
</html>
